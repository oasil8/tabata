<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 붓글씨처럼 거친 가장자리 (WSBOXING 로고 느낌) -->
    <filter id="brush" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.5" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="9"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#000"/>
  <!-- 스톱워치: 금색 링 + 꼭지 + 눈금 -->
  <g fill="none" stroke="#F7B500" stroke-linecap="round">
    <circle cx="256" cy="282" r="176" stroke-width="22"/>
    <line x1="256" y1="96" x2="256" y2="70" stroke-width="22"/>
    <line x1="222" y1="62" x2="290" y2="62" stroke-width="22"/>
    <line x1="388" y1="134" x2="408" y2="114" stroke-width="18"/>
    <g stroke-width="10">
      <line x1="256" y1="128" x2="256" y2="150"/>
      <line x1="256" y1="414" x2="256" y2="436"/>
      <line x1="102" y1="282" x2="124" y2="282"/>
      <line x1="388" y1="282" x2="410" y2="282"/>
    </g>
  </g>
  <!-- WS 붓글씨 -->
  <text x="256" y="334" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="170"
        fill="#fff" transform="skewX(-12) translate(60 0)" filter="url(#brush)">WS</text>
  <text x="256" y="390" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="38"
        letter-spacing="6" fill="#F7B500">TABATA</text>
</svg>
